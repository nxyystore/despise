[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "despise"
version = "1.0.0"
description = "Minimal yet extensive selfbot library for discord."
requires-python = ">=3.10"
dependencies = ["curl-cffi>=0.7"]

[project.optional-dependencies]
# Per-token session cache (ROADMAP Tier 2). Optional until the code lands,
# so a default install stays at one runtime dep.
session-cache = ["cashews>=7.6"]
session-cache-redis = ["cashews[redis]>=7.6"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["despise*"]

[tool.setuptools.package-data]
despise = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true